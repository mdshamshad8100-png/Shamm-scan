<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1a"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>SHAMM Scanner</title>
<style>
:root{--bg:#0b1220;--card:#14203a;--ink:#e8f1ff;--mut:#8ea0bd;--a:#1fb6c9;--b:#2563eb;--g:linear-gradient(135deg,#2563eb,#1fb6c9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
.v{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.v.on{display:flex}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;font-size:18px}
header .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,label.bt{font:inherit;color:inherit;background:var(--card);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
.p{background:var(--g);color:#fff;font-weight:600}
.row{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;align-items:center}
.row button{flex:none;white-space:nowrap}
.row button.sel{outline:2px solid var(--a)}
.list{flex:1;overflow:auto;padding:0 12px 100px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.item img{width:54px;height:72px;object-fit:cover;border-radius:6px;background:#fff}
.item .m{flex:1;min-width:0}.item small{color:var(--mut)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;align-content:start}
.pg{position:relative;background:var(--card);border-radius:10px;padding:6px}
.pg img{width:100%;border-radius:6px;background:#fff;display:block}
.pg .n{position:absolute;left:10px;bottom:10px;background:#000a;border-radius:6px;padding:2px 8px}
.add{border:2px dashed #3a4a68;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);min-height:140px;cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--g);font-size:28px;padding:0;color:#fff}
.stage{flex:1;position:relative;overflow:hidden;background:#000}
.stage>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage svg{touch-action:none}
.bar{display:flex;justify-content:space-around;align-items:center;padding:12px}
.shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--g);padding:0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;display:none;z-index:9;max-width:90%;text-align:center}
textarea{flex:1;margin:12px;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:12px;font:14px/1.5 system-ui}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}.brand{font-weight:800;font-size:19px;flex:1}
.nav{display:flex;align-items:center;justify-content:space-around;height:64px;background:#0f1729;border-top:1px solid #1d2a47}
.nav button{background:none;color:var(--mut);font-size:13px}.nav button.on{color:var(--a);font-weight:700}
.nav .cam{width:64px;height:64px;border-radius:50%;margin-top:-34px;background:var(--g);box-shadow:0 6px 18px #1fb6c966;font-size:26px;padding:0;color:#fff}
.card{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden}
.card .th{height:200px;background:#fff center top/cover no-repeat;cursor:pointer}.card .in{padding:10px 14px}
.card .ac{display:flex;gap:8px;padding:0 10px 12px}.card .ac button{flex:1;background:#1b2a4a}
.srch{margin:0 12px 10px;padding:12px 14px;border-radius:12px;border:0;background:var(--card);color:var(--ink);font:inherit}
.ft{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:6px;background:none}
.ft img{width:62px;height:80px;object-fit:cover;border-radius:8px;border:2px solid transparent;background:#fff}.ft.sel{color:var(--a)}.ft.sel img{border-color:var(--a)}
.list{padding-bottom:20px}
:root{--bg:#070d1a;--card:#0e1a31;--ink:#eaf4ff;--mut:#8497b5;--a:#2fe3d3;--b:#3a86ff;--g:linear-gradient(135deg,#3a86ff,#2fe3d3)}
.hero{margin:0 12px 16px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#10294f,#0b5a66);display:flex;align-items:center;gap:14px;border:1px solid #1c3e6e}
.hero img{width:64px;height:64px;border-radius:16px}.hero b{font-size:21px}.hero small{color:#a9c4de}
.nav{background:#0a1326;border-top:1px solid #16264a}.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px}
.nav svg,#sd svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cam{box-shadow:0 8px 24px #2fe3d355;border:3px solid var(--bg);min-width:66px;align-items:center;justify-content:center}.nav .cam svg{width:30px;height:30px;stroke:#04121f;stroke-width:2.2}
#sdb{position:fixed;inset:0;background:#000b;display:none;z-index:8}#sdb.on{display:block}
#sd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:12px;z-index:9;width:min(300px,86vw)}#sd.on{display:flex}
#sd button{display:flex;flex-direction:row;align-items:center;gap:14px;background:#15274a;border:1px solid #234173;border-radius:40px;padding:16px 22px;font-size:16px;font-weight:600}
.card,.item{border:1px solid #16264a}.card .th{border-bottom:1px solid #16264a}.card .ac button{background:#15274a}.srch{border:1px solid #16264a}
.tb{display:flex;align-items:center;gap:8px;margin:2px 0 12px}.tb b{flex:1;font-size:18px}
#sb{position:absolute;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;background:#15274a;border:1px solid #234173;border-radius:16px;padding:10px 14px;z-index:5}#sb span{flex:1}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #4a6aa0;flex:none}.ck.on{background:var(--g);border-color:var(--a)}
#spl{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99;transition:opacity .45s}
#spl img{width:128px;height:128px;border-radius:30px;box-shadow:0 12px 44px #2fe3d355}#spl b{font-size:24px}#spl small{color:var(--mut)}
select.bt{background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:10px;font:inherit}
</style></head><body>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let batch=false,idm=0,lk=0,idf,cur,pi=0,stream,quad,raw,auto=true,stable=0,last=null,drag=-1;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)};
const show=id=>$$('.v').forEach(v=>v.classList.toggle('on',v.id===id));
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
// Storage (IndexedDB)
const idb=new Promise((r,j)=>{const q=indexedDB.open('shamm',1);q.onupgradeneeded=()=>q.result.createObjectStore('d',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await idb;return new Promise(r=>{const q=f(d.transaction('d',m).objectStore('d'));q.onsuccess=()=>r(q.result)})};
const save=d=>tx('readwrite',o=>o.put(d)),del=id=>tx('readwrite',o=>o.delete(id)),all=()=>tx('readonly',o=>o.getAll());
const keep=()=>cur.pages.length?save(cur):del(cur.id);
// Document detection: Otsu threshold, largest bright region, extreme corners
function detect(src,w,h){
 const s=120/Math.max(w,h),W=Math.round(w*s),H=Math.round(h*s),c=cv(W,H),x=c.getContext('2d',{willReadFrequently:true});
 x.filter='blur(1px)';x.drawImage(src,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data,N=W*H,g=new Uint8Array(N),hist=new Array(256).fill(0);
 for(let i=0;i<N;i++){const v=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0;g[i]=v;hist[v]++}
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
 let sb=0,wb=0,mx=0,th=127;
 for(let t=0;t<256;t++){wb+=hist[t];if(!wb)continue;const wf=N-wb;if(!wf)break;sb+=t*hist[t];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>mx){mx=v;th=t}}
 const lab=new Int32Array(N),st=[];let best=0,bl=0,L=0;
 for(let i=0;i<N;i++){if(g[i]<=th||lab[i])continue;L++;let n=0;st.push(i);lab[i]=L;
  while(st.length){const p=st.pop(),px=p%W;n++;
   if(px>0&&g[p-1]>th&&!lab[p-1]){lab[p-1]=L;st.push(p-1)}
   if(px<W-1&&g[p+1]>th&&!lab[p+1]){lab[p+1]=L;st.push(p+1)}
   if(p>=W&&g[p-W]>th&&!lab[p-W]){lab[p-W]=L;st.push(p-W)}
   if(p<N-W&&g[p+W]>th&&!lab[p+W]){lab[p+W]=L;st.push(p+W)}}
  if(n>best){best=n;bl=L}}
 if(best<N*.15||best>N*.97)return null;

 for(let i=0;i<N;i++){if(lab[i]!==bl)continue;const px=i%W,py=(i/W)|0,a=px+py,b=px-py;
  if(a<V[0]){V[0]=a;P[0]=[px,py]}if(b>V[1]){V[1]=b;P[1]=[px,py]}if(a>V[2]){V[2]=a;P[2]=[px,py]}if(b<V[3]){V[3]=b;P[3]=[px,py]}}

}
// Camera
async function openCam(){lk++;const L=lk;fl=false;$('#fl').textContent='Flash';$('#cam .t').textContent=idm?(idm===1?'ID card: front side':'ID card: back side'):batch?`Batch scan (${cur.pages.length})`:'Scan';show('cam');last=null;stable=0;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',advanced:[{focusMode:'continuous'}],width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=$('#vid');v.srcObject=stream;await v.play();loop(L)}catch(e){toast('Camera unavailable. Allow camera access or use Import.')}}
const stopCam=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null};
function loop(id=lk){if(!stream||id!==lk)return;const v=$('#vid');
 if(v.videoWidth){const q=detect(v,v.videoWidth,v.videoHeight),W=v.videoWidth,H=v.videoHeight,o=$('#ov');
  o.setAttribute('viewBox',`0 0 ${W} ${H}`);
  o.innerHTML=q?`<polygon points="${q.map(p=>[p[0]*W,p[1]*H])}" fill="#1fb6c91f" stroke="#1fb6c9" stroke-width="${W/200}"/>`+q.map(p=>`<circle cx="${p[0]*W}" cy="${p[1]*H}" r="${W/90}" fill="#2563eb" stroke="#fff" stroke-width="${W/300}"/>`).join(''):'';
  stable=q&&last&&q.every((p,i)=>Math.hypot(p[0]-last[i][0],p[1]-last[i][1])<.03)?stable+1:0;last=q;
  if(auto&&q&&stable>10){stable=0;snap();return}}

const FULL=[[0,0],[1,0],[1,1],[0,1]];

async function still(){const v=$('#vid');
 try{const t=stream.getVideoTracks()[0];if(window.ImageCapture){const i=await load(URL.createObjectURL(await new ImageCapture(t).takePhoto())),k=Math.min(1,3200/Math.max(i.naturalWidth,i.naturalHeight)),c=cv(Math.round(i.naturalWidth*k),Math.round(i.naturalHeight*k));c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c}}catch(e){}

async function snap(){const v=$('#vid');if(!v.videoWidth)return;const c=await still();
 if(batch){lk++;const id=lk;toast('Page '+(cur.pages.length+1)+' captured');await addPage(c,detect(c,c.width,c.height)||FULL);$('#cam .t').textContent=`Batch scan (${cur.pages.length})`;last=null;stable=0;setTimeout(()=>loop(id),1200)}else toCrop(c)}
// Crop
function toCrop(c){stopCam();raw=c;quad=detect(c,c.width,c.height)||[[.04,.04],[.96,.04],[.96,.96],[.04,.96]];
 const cc=$('#cc');cc.width=c.width;cc.height=c.height;cc.getContext('2d').drawImage(c,0,0);
 $('#cs').setAttribute('viewBox',`0 0 ${c.width} ${c.height}`);drawQ();show('crop')}
function drawQ(){const W=raw.width,H=raw.height,p=quad.map(q=>[q[0]*W,q[1]*H]),r=Math.max(W,H)/36;
 $('#cs').innerHTML=`<polygon points="${p.join(' ')}" fill="#1fb6c933" stroke="#1fb6c9" stroke-width="${r/4}"/>`+p.map((q,i)=>`<circle data-i="${i}" cx="${q[0]}" cy="${q[1]}" r="${r}" fill="#fff" stroke="#2563eb" stroke-width="${r/4}"/>`).join('')}
const cs=$('#cs');
cs.addEventListener('pointerdown',e=>{const i=e.target.dataset.i;if(i!=null){drag=+i;cs.setPointerCapture(e.pointerId)}});
cs.addEventListener('pointermove',e=>{if(drag<0)return;const r=cs.getBoundingClientRect(),W=raw.width,H=raw.height,s=Math.min(r.width/W,r.height/H),ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;

function warp(c,q){const P=q.map(p=>[p[0]*c.width,p[1]*c.height]),d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
